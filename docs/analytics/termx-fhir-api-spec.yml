 /CodeSystem/$lookup:
 get:
 tags:
 - CodeSystem
 summary: operation
 description: lookup
 parameters:
 - name: code
 in: query
 description: "The code that is to be located. If a code is provided, a system\
 \ must be provided"
 schema:
 type: string
 - name: system
 in: query
 description: The system for the code that is to be located
 schema:
 type: string
 - name: version
 in: query
 description: "The version of the system, if one was provided in the source\
 \ data"
 schema:
 type: string
 - name: date
 in: query
 description: "The date for which the information should be returned. Normally,\
 \ this is the current conditions (which is the default value) but under\
 \ some circumstances, systems need to acccess this information as it would\
 \ have been in the past. A typical example of this would be where code selection\
 \ is constrained to the set of codes that were available when the patient\
 \ was treated, not when the record is being edited. Note that which date\
 \ is appropriate is a matter for implementation policy."
 schema:
 type: string
 - name: property
 in: query
 description: "A property that the client wishes to be returned in the output.\
 \ If no properties are specified, the server chooses what to return. The\
 \ following properties are defined for all code systems: name, version (code\
 \ system info) and code information: display, designation, and lang.X where\
 \ X is a designation language code. These properties are returned explicitly\
 \ in named out parameters with matching names, or in designations. In addition,\
 \ any property codes defined by [this specification](codesystem.html#defined-props)\
 \ or by the CodeSystem ([CodeSystem.property.code](codesystem-definitions.html#CodeSystem.property))\
 \ are allowed, and these are returned in the out parameter ```property```"
 schema:
 type: string
 responses:
 "200":
 description: response
