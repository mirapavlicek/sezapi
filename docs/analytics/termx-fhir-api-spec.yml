 /ValueSet/$validate-code:
 get:
 tags:
 - ValueSet
 summary: operation
 description: validate-code
 parameters:
 - name: url
 in: query
 description: "Value set Canonical URL. The server must know the value set\
 \ (e.g. it is defined explicitly in the server's value sets, or it is defined\
 \ implicitly by some code system known to the server"
 schema:
 type: string
 - name: valueSetVersion
 in: query
 description: "The identifier that is used to identify a specific version of\
 \ the value set to be used when validating the code. This is an arbitrary\
 \ value managed by the value set author and is not expected to be globally\
 \ unique. For example, it might be a timestamp (e.g. yyyymmdd) if a managed\
 \ version is not available."
 schema:
 type: string
 - name: code
 in: query
 description: "The code that is to be validated. If a code is provided, a system\
 \ or a context must be provided (if a context is provided, then the server\
 \ SHALL ensure that the code is not ambiguous without a system)"
 schema:
 type: string
 - name: system
 in: query
 description: The system for the code that is to be validated
 schema:
 type: string
 - name: systemVersion
 in: query
 description: "The version of the system, if one was provided in the source\
 \ data"
 schema:
 type: string
 - name: display
 in: query
 description: "The display associated with the code, if provided. If a display\
 \ is provided a code must be provided. If no display is provided, the server\
 \ cannot validate the display value, but may choose to return a recommended\
 \ display name using the display parameter in the outcome. Whether displays\
 \ are case sensitive is code system dependent"
 schema:
 type: string
 - name: coding
 in: query
 description: A coding to validate
 schema:
 type: string
 - name: codeableConcept
 in: query
 description: "A full codeableConcept to validate. The server returns true\
 \ if one of the coding values is in the value set, and may also validate\
 \ that the codings are not in conflict with each other if more than one\
 \ is present"
 schema:
 type: string
 responses:
 "200":
 description: response
 post:
 tags:
 - ValueSet
 summary: operation
 description: validate-code
 requestBody:
 content:
 application/fhir+json:
