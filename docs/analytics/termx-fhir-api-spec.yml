 \ value set (e.g. it is defined explicitly in the server's value sets, or\
 \ it is defined implicitly by some code system known to the server"
 schema:
 type: string
 - name: valueSetVersion
 in: query
 description: "The identifier that is used to identify a specific version of\
 \ the value set to be used when generating the expansion. This is an arbitrary\
 \ value managed by the value set author and is not expected to be globally\
 \ unique. For example, it might be a timestamp (e.g. yyyymmdd) if a managed\
 \ version is not available."
