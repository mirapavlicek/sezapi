 /CodeSystem/$find-matches:
 get:
 tags:
 - CodeSystem
 summary: operation
 description: find-matches
 parameters:
 - name: system
 in: query
 description: The system in which composition is to be performed. This must
 be provided unless the operation is invoked on a code system instance
 schema:
 type: string
 - name: version
 in: query
 description: The version of the system for the inferencing to be performed
 schema:
 type: string
 - name: property
 in: query
 description: One or more properties that contain information to be composed
 into the code
 schema:
 type: string
 - name: exact
 in: query
 description: "Whether the operation is being used by a human ('false'), or\
 \ a machine ('true'). If the operation is being used by a human, the terminology\
 \ server can return a list of possible matches, with commentary. For a machine,\
 \ the server returns complete or partial matches, not possible matches.\
 \ The default value is 'false'"
 schema:
